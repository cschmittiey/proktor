<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0605">
<title>proktor</title>
<style>
  :root {
    --bg: #0b0605;
    --panel: #160d0a;
    --line: #3a1d14;
    --text: #d98a3d;
    --dim: #8a5a2e;
    --bright: #f0a24a;
    --red: #b3382a;
    --redtxt: #e06a58;
    --ok: #7a9a3a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 12px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
    max-width: 640px; margin: 0 auto;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; }
  h1 { font-size: 15px; letter-spacing: .2em; text-transform: uppercase; margin: 0; color: var(--dim); font-weight: 600; }
  #conn { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--dim); }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
  #conn.on #dot { background: var(--ok); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
  .label { font-size: 12px; letter-spacing: .15em; text-transform: uppercase; color: var(--dim); margin-bottom: 4px; }
  #mode { display: inline-block; padding: 2px 10px; border: 1px solid var(--dim); border-radius: 99px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--bright); }
  #now { font-size: 30px; line-height: 1.15; color: var(--bright); margin: 10px 0 4px; overflow-wrap: anywhere; font-weight: 600; }
  #now.empty { color: var(--dim); font-weight: 400; }
  #performer, #event { color: var(--text); font-size: 18px; overflow-wrap: anywhere; }
  #pending { display: none; border-color: var(--red); }
  #pending.show { display: block; }
  #pending .pt { font-size: 20px; color: var(--bright); overflow-wrap: anywhere; }
  #countdown { color: var(--redtxt); margin-top: 2px; }
  ol { list-style: none; margin: 0; padding: 0; }
  li { padding: 6px 0; border-top: 1px solid var(--line); font-size: 15px; display: flex; gap: 10px; justify-content: space-between; }
  li:first-child { border-top: 0; }
  li span:first-child { overflow-wrap: anywhere; }
  li span:last-child { color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  label { display: block; font-size: 12px; letter-spacing: .15em; text-transform: uppercase; color: var(--dim); margin: 12px 0 4px; }
  input {
    width: 100%; min-height: 52px; font: inherit; font-size: 18px; padding: 8px 12px;
    background: #050302; color: var(--bright); border: 1px solid var(--line); border-radius: 8px;
  }
  input:focus { outline: 2px solid var(--red); outline-offset: 1px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  button {
    min-height: 54px; font: inherit; font-size: 17px; font-weight: 600; padding: 8px 10px;
    background: #24120d; color: var(--bright); border: 1px solid var(--dim); border-radius: 8px; cursor: pointer;
    touch-action: manipulation;
  }
  button:active { background: #3a1d14; }
  button.primary { background: #4a1f12; border-color: var(--red); }
  button.danger { border-color: var(--red); color: var(--redtxt); }
  button.armed { background: var(--red); color: #fff; }
  button:disabled { opacity: .5; }
  button.full { grid-column: 1 / -1; }
  #msg { min-height: 24px; margin: 12px 0 0; font-size: 15px; color: var(--dim); }
  #msg.err { color: var(--redtxt); }
  footer { margin-top: 20px; font-size: 13px; color: var(--dim); display: flex; justify-content: space-between; }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<header>
  <h1>proktor</h1>
  <div id="conn"><span id="dot"></span><span id="connText">connecting…</span></div>
</header>

<section class="card" aria-live="polite">
  <span id="mode">idle</span>
  <div id="now" class="empty">—</div>
  <div id="performer"></div>
  <div id="event" class="label"></div>
</section>

<section class="card" id="pending">
  <div class="label">Pending</div>
  <div class="pt" id="pendingText"></div>
  <div id="countdown"></div>
</section>

<section class="card">
  <div class="label">Recent</div>
  <ol id="history"><li><span>nothing yet</span><span></span></li></ol>
</section>

<section class="card">
  <label for="artist">Artist</label>
  <input id="artist" autocomplete="off" autocapitalize="words" enterkeyhint="next">
  <label for="title">Title</label>
  <input id="title" autocomplete="off" autocapitalize="words" enterkeyhint="send">
  <label for="perf">Performer</label>
  <input id="perf" autocomplete="off" autocapitalize="words" enterkeyhint="send">

  <div class="row">
    <button class="primary full" id="bSet">Set track</button>
    <button id="bPerf">Set performer</button>
    <button id="bLive">Live act</button>
    <button id="bSkip">Skip pending</button>
    <button class="danger" id="bClear" data-confirm="1">Clear (wrong track)</button>
    <button class="danger full" id="bIdle" data-confirm="1">Idle</button>
  </div>
  <div id="msg" role="status"></div>
</section>

<footer>
  <span><a href="#" id="tokLink">change token</a></span>
  <span><a href="/now">/now</a> · <a href="/tracks?format=txt">/tracks</a> · <a href="/health">/health</a></span>
</footer>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var TOKEN_KEY = "proktor.token";
  var st = null;          // latest state
  var skew = 0;           // server time minus client time, ms

  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function nowMs() { return Date.now() + skew; }
  function line(a, t) { return a && t ? a + " - " + t : (a || t || ""); }
  function hhmm(iso) {
    var d = new Date(iso);
    if (isNaN(d)) return "";
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  // ---- rendering ----
  function render(s) {
    st = s;
    $("mode").textContent = s.mode || "idle";
    var now = $("now");
    var text = "";
    if (s.mode === "track" && s.track) text = line(s.track.artist, s.track.title);
    else if (s.mode === "live") text = "LIVE";
    now.textContent = text || (s.mode === "idle" ? "nothing playing" : "—");
    now.className = text ? "" : "empty";
    $("performer").textContent = s.performer ? (s.mode === "live" ? s.performer : "with " + s.performer) : "";
    $("event").textContent = s.event_name || "";

    var h = $("history");
    h.textContent = "";
    var items = (s.history || []).slice(0, 6);
    if (!items.length) items = null;
    (items || [{ artist: "nothing yet", title: "" }]).forEach(function (t) {
      var li = document.createElement("li");
      var a = document.createElement("span"), b = document.createElement("span");
      a.textContent = line(t.artist, t.title);
      b.textContent = items && t.started_at ? hhmm(t.started_at) : "";
      li.appendChild(a); li.appendChild(b); h.appendChild(li);
    });
    tick();
  }

  function tick() {
    var p = st && st.pending;
    $("pending").className = p ? "card show" : "card";
    if (!p) return;
    $("pendingText").textContent = line(p.artist, p.title);
    var left = Math.round((Date.parse(p.publish_at) - nowMs()) / 1000);
    $("countdown").textContent = left > 0 ? "goes live in " + left + "s" : "going live…";
  }
  setInterval(tick, 500);

  // ---- live connection ----
  function setConn(on, text) {
    $("conn").className = on ? "on" : "";
    $("connText").textContent = text;
  }
  function connect() {
    var es = new EventSource("/events");
    es.onopen = function () { setConn(true, "live"); syncClock(); };
    es.addEventListener("state", function (e) {
      try { render(JSON.parse(e.data)); } catch (err) {}
    });
    es.onerror = function () { setConn(false, "reconnecting…"); };
  }
  function syncClock() {
    var t0 = Date.now();
    fetch("/health", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (j) {
      var t1 = Date.now();
      var server = Date.parse(j.time);
      if (!isNaN(server)) skew = server - (t0 + t1) / 2;
    }).catch(function () {});
  }
  setInterval(syncClock, 60000);

  // ---- commands ----
  var msgTimer;
  function say(text, err) {
    var m = $("msg");
    m.textContent = text;
    m.className = err ? "err" : "";
    clearTimeout(msgTimer);
    if (!err) msgTimer = setTimeout(function () { m.textContent = ""; }, 4000);
  }
  function askToken(force) {
    var t = load(TOKEN_KEY);
    if (!t || force) {
      t = window.prompt("Control token (kept on this device):", t || "");
      if (t == null) return null;
      t = t.trim();
      store(TOKEN_KEY, t || null);
    }
    return t || null;
  }
  function send(cmd, done) {
    var token = askToken(false);
    if (!token) { say("A token is needed to change anything.", true); return; }
    fetch("/now", {
      method: "POST",
      headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify(cmd)
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { r: r, j: j }; });
    }).then(function (x) {
      if (x.r.ok) { render(x.j); say("ok: " + cmd.action); if (done) done(); return; }
      if (x.r.status === 401) say("Token rejected (401). Tap \"change token\".", true);
      else if (x.r.status === 403) say("Writes are disabled on this server: no token configured (403).", true);
      else say("Error " + x.r.status + ": " + (x.j.error || "request failed"), true);
    }).catch(function () { say("Can't reach proktor.", true); });
  }

  function val(id) { return $(id).value.trim(); }
  $("bSet").onclick = function () {
    var a = val("artist"), t = val("title");
    if (!a && !t) { say("Enter an artist and/or title first.", true); return; }
    var cmd = { action: "set", artist: a, title: t };
    send(cmd, function () { $("artist").value = ""; $("title").value = ""; });
  };
  $("bPerf").onclick = function () { send({ action: "performer", performer: val("perf") }); };
  $("bLive").onclick = function () {
    if (!val("perf")) { say("Enter the performer's name first.", true); return; }
    send({ action: "live", performer: val("perf") });
  };
  $("bSkip").onclick = function () { send({ action: "skip" }); };
  $("bClear").onclick = function () { send({ action: "clear" }); };
  $("bIdle").onclick = function () { send({ action: "idle" }); };

  // Destructive buttons: first tap arms, second tap within 3s fires.
  Array.prototype.forEach.call(document.querySelectorAll("button[data-confirm]"), function (b) {
    var orig = b.textContent, fire = b.onclick, timer = null;
    b.onclick = function () {
      if (timer) { clearTimeout(timer); timer = null; b.className = b.className.replace(" armed", ""); b.textContent = orig; fire(); return; }
      b.className += " armed"; b.textContent = "Tap again to confirm";
      timer = setTimeout(function () { timer = null; b.className = b.className.replace(" armed", ""); b.textContent = orig; }, 3000);
    };
  });

  Array.prototype.forEach.call(document.querySelectorAll("input"), function (i) {
    i.addEventListener("keydown", function (e) {
      if (e.key !== "Enter") return;
      if (i.id === "perf") $("bPerf").click(); else $("bSet").click();
    });
  });
  $("tokLink").onclick = function (e) { e.preventDefault(); if (askToken(true)) say("Token saved."); };

  connect();
})();
</script>
</body>
</html>
